{{ define "main" }}
<article class="page page--{{ .Slug }}{{ with .Params.page_class }} {{ . }}{{ end }}">
  <header class="page-header">
    <div class="container">
      <h1 class="page-title">{{ .Title }}</h1>
      {{ if .Params.subtitle }}
      <p class="page-subtitle">{{ .Params.subtitle }}</p>
      {{ end }}
    </div>
  </header>

  <div class="container">
    <div class="page-content content">
      {{ .Content }}
    </div>
  </div>

  {{ if .Lastmod }}
  <footer class="page-footer">
    <p class="page-meta">Última actualización: {{ .Lastmod | time.Format ":date_long" }}</p>
  </footer>
  {{ end }}
</article>
{{ end }}
